<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Un ramo para Natali</title>
  <meta name="description" content="Un ramo virtual de rosas para Natali." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Instrument Serif / Inter stand in for Refero's Kalice / Neue Montreal -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="scene" role="img" aria-label="Ramo de rosas color rubor en 3D que florece lentamente; arrastra para girarlo"></canvas>

  <header class="nav">
    <a class="brand" href="./">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2c2.2 2 3.3 4 3.3 6a3.3 3.3 0 0 1-6.6 0C8.7 6 9.8 4 12 2Zm-7 7c2.9-.3 5 .4 6.2 2.1a3.3 3.3 0 0 1-5.4 3.8C4.6 13.3 4.3 11.4 5 9Zm14 0c.7 2.4.4 4.3-.8 5.9a3.3 3.3 0 0 1-5.4-3.8C14 9.4 16.1 8.7 19 9Zm-7 7.2V22h-1.5v-5.8h1.5Z"/></svg>
      Flora
    </a>
    <span class="crumb">/</span>
    <span class="crumb-page">Ramo</span>
    <span class="badge"><i class="dot"></i>Beta</span>
  </header>

  <main class="hero">
    <p class="eyebrow">Para que veas que no soy un Psicopata jajaj</p>
    <h1 class="display">Un Ramo Virtual <em>Para Natali</em></h1>
    <button class="pill" id="replay">
      Verlo florecer otra vez
      <span class="pill-action" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
      </span>
    </button>
  </main>

  <footer class="meta">
    <span>FLORACIÓN <b id="bloom">0%</b></span>
    <span>ROSAS <b id="rose-count">12</b></span>
    <span>PÉTALOS <b id="petal-count">—</b></span>
    <span class="hide-sm">THREE.JS · WEBGL</span>
  </footer>

  <script type="module" src="/main.js"></script>
</body>
</html>
